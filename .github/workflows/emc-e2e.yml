name: Daily EMC E2E
on:
  schedule:
    - cron: '15 8 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/emc/**'
      - '.github/workflows/emc-e2e.yml'
permissions:
  contents: read
concurrency:
  group: emc-e2e-daily
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://emcordioli.com.br/
    defaults:
      run:
        working-directory: tests/emc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile E2E
        run: npm test
      - name: Save report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emc-e2e-report
          path: |
            tests/emc/playwright-report/
            tests/emc/test-results/
          retention-days: 14
          if-no-files-found: ignore
